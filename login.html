<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | AAU Admin Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--quaternary); }
    .auth-card {
      width: 420px; max-width: 100%;
      background: var(--tertiary); border-radius: 24px; padding: 36px 32px;
      animation: rise 250ms ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-head { text-align: center; margin-bottom: 24px; }
    .auth-logo { width: 64px; height: 64px; margin: 0 auto 16px; display: block; }
    .auth-head h1 { margin: 0 0 6px; font-size: 22px; }
    .auth-head p { margin: 0; color: var(--light-gray); font-size: 14px; }
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
    .auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
    .auth-form input {
      background: var(--quaternary); color: var(--white);
      border: 1px solid var(--gray); border-radius: 10px;
      padding: 11px 14px; font: inherit; font-weight: 400;
    }
    .auth-form input:focus { outline: 2px solid var(--golden); }
    .auth-submit {
      background: var(--secondary); color: #14142B; border: 0; border-radius: 10px;
      padding: 12px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    .auth-submit:hover { filter: brightness(.92); }
    .auth-note { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--gray); }
    @media (prefers-reduced-motion: reduce) { .auth-card { animation: none; } }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-head">
        <img src="assets/AAU.png" alt="AAU logo" class="brand-logo auth-logo">
        <h1>AAU Admin Portal</h1>
        <p>Log in to manage the Association's records.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <label>Email
          <input type="email" placeholder="name@example.org" required>
        </label>
        <label>Password
          <input type="password" placeholder="Enter your password" required>
        </label>
        <button class="auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-note">Demo only: no password is checked.</p>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
