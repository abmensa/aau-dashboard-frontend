<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged out | AAU Admin Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--quaternary);
    }
    .auth-card {
      width: 440px;
      max-width: 100%;
      text-align: center;
      background: var(--tertiary);
      border-radius: 24px;
      padding: 40px 32px;
      animation: rise 250ms ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo { width: 64px; height: 64px; margin: 0 auto 20px; display: block; }
    .auth-icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--senary);
      color: var(--quinary);
      display: grid; place-items: center;
    }
    .auth-icon svg { width: 28px; height: 28px; }
    .auth-card h1 { margin: 0 0 8px; font-size: 22px; }
    .auth-card p { margin: 0 0 8px; color: var(--light-gray); line-height: 1.5; }
    .auth-time { font-size: 12px; color: var(--gray); margin-bottom: 24px !important; }
    .auth-actions { display: flex; flex-direction: column; gap: 10px; }
    .auth-btn {
      display: block;
      padding: 12px 18px;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: filter 150ms ease-out, background-color 150ms ease-out;
    }
    .auth-btn.primary { background: var(--secondary); color: #14142B; }
    .auth-btn.primary:hover { filter: brightness(.92); }
    .auth-btn.ghost { border: 1px solid var(--gray); color: var(--white); }
    .auth-btn.ghost:hover { background: rgba(255, 255, 255, .08); }
    .auth-btn:focus-visible { outline: 2px solid var(--golden); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .auth-card { animation: none; } }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" role="status">
      <img src="assets/AAU.png" alt="AAU logo" class="brand-logo auth-logo">

      <div class="auth-icon"><i data-lucide="check-circle"></i></div>

      <h1>You have been logged out</h1>
      <p>Thank you for using the AAU Admin Portal. For your security, close this window if you are using a shared computer.</p>
      <p class="auth-time" id="outTime"></p>

      <div class="auth-actions">
        <a class="auth-btn primary" href="login.html">Log in again</a>
        <a class="auth-btn ghost" href="https://aau.org" target="_blank" rel="noopener">Go to the AAU website</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    // show the time you logged out
    const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    document.getElementById("outTime").textContent = "Logged out at " + t;
  </script>
</body>
</html>
